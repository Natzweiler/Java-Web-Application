<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Nebula</title>
    <style>
        body {
            background: #3E5577;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        form {
            background: #1E2A38;
            padding: 20px 30px;
            border-radius: 8px;
            width: 350px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        span {
            font-size: 12px;
            color: #ccc;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 4px;
            border-radius: 4px;
            border: none;
            box-sizing: border-box;
        }

        input[type="radio"] {
            margin-right: 5px;
        }

        .radios {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .checkbox {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            margin-right: 10px;
            cursor: pointer;
        }

        button[type="submit"] {
            background: #4CAF50;
            color: #fff;
        }

        button[type="reset"] {
            background: #f44336;
            color: #fff;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        select:focus {
        background-color: #FFEB3B;  
        color: #1E2A38;            
        outline: none;            
}

    </style>
</head>
<body>
    <form>
        <h3>Nuevo usuario</h3>
        <span>Completa la información y envía tus datos</span>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre completo">
        <span>Tu nombre completo</span>

        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="Tu correo para recibir notificaciones">
        <span>Tu correo para recibir notificaciones</span>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="La contraseña para iniciar sesión">
        <span>La contraseña para iniciar sesión</span>

        <label for="pseudonimo">Pseudónimo</label>
        <input type="text" id="pseudonimo" placeholder="Tu pseudónimo">
        <span>Tu pseudónimo para identificarte con otros usuarios</span>

        <label>Estado</label>
        <div class="radios">
            <label><input type="radio" name="estado" value="activo"> Activo</label>
            <label><input type="radio" name="estado" value="inactivo"> Inactivo</label>
            <label><input type="radio" name="estado" value="pendiente"> Pendiente</label>
        </div>

        <label for="cuenta">Cuenta</label>
        <select id="cuenta">
            <option value="">-Selecciona-</option>
            <option value="gratuita">Gratuita</option>
            <option value="básica">Básica</option>
            <option value="premium">Premium</option>
        </select>
        <span>Tu tipo de cuenta para desbloquear características</span>

        <label for="fecha">Fecha de nacimiento</label>
        <input type="date" id="fecha">
        <span>Tu fecha de nacimiento</span>

        <div class="checkbox">
            <label>
                <input type="checkbox" required> Aceptar términos y condiciones
            </label>
        </div>

        <button type="submit">Registrar</button>
        <button type="reset">Cancelar</button>
    </form>
</body>
</html>
